name: "Deploy Lambda Image"
description: "Deploys (updates) an AWS Lambda function to use a new container image in ECR"
inputs:
  lambda_name:
    description: "Name of the Lambda function to deploy"
    required: true
  registry:
    description: "ECR registry, including the namespace (e.g. 123456789012.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome)"
    required: true
  image_name:
    description: "Repository name under the namespace (e.g. unified_pipeline_lambda)"
    required: true
  deploy_tag:
    description: "Tag of the image to deploy"
    required: true
  role_to_assume:
    description: "AWS role to assume for deployment"
    required: true
  aws_region:
    description: "AWS region of the Lambda/ECR"
    required: false
    default: "eu-west-1"
  publish:
    # Compared as a string in deploy.sh: action inputs are always strings, and
    # `type` is ignored here, so a bare truthiness test is true even for "false".
    description: "Publish a numbered Lambda version as well as updating $LATEST. The string 'true' enables it."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.role_to_assume }}

    - name: Deploy Lambda container image
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
      run: |
        "${{ github.action_path }}/deploy.sh" \
          "${{ inputs.lambda_name }}" \
          "${{ inputs.registry }}" \
          "${{ inputs.image_name }}" \
          "${{ inputs.deploy_tag }}"

