name: "Docker build and push"
description: "Builds and publishes a Docker image to ECR"
inputs:
  registry:
    description: "ECR registry where the image is to be published"
    required: true
  folder:
    description: "working folder"
    required: true
  target:
    description: "target to build in a multistage docker"
    required: true
  tag:
    description: "tag for the image"
    required: true
  role_to_assume:
    description: "role to assume when pushing the image to ECR (required unless push is 'false')"
    required: false
    default: ""
  push:
    # String-compared like publish_latest. Lets callers build without
    # publishing on runs that have no repo secrets (dependabot, fork PRs),
    # e.g. push: ${{ secrets.MY_ROLE_ARN != '' }}
    description: "Push the built image to ECR. Any string other than 'true' builds only."
    required: false
    default: "true"
  publish_latest:
    # Compared as a string below: action inputs are always strings, and `type`
    # is ignored here, so a bare truthiness test is true even for "false".
    description: "Publish an image tagged 'latest'. The string 'true' enables it."
    required: false
    default: "false"
  dockerfile:
    description: "Path to the Dockerfile (relative to the working folder)"
    required: false
    default: "Dockerfile"
runs:
  using: "composite"
  steps:
    - name: build docker image
      run: |
        if [ -n "${{ inputs.dockerfile }}" ]; then
          echo "Using explicit Dockerfile: ${{ inputs.dockerfile }}";
          docker build . \
            -f "${{ inputs.dockerfile }}" \
            --build-arg pythonversion=$(cat .python-version) \
            --provenance=false \
            --tag "${{inputs.target}}:${{inputs.tag}}" \
            --target "${{inputs.target}}";
        else
          echo "No dockerfile input provided (empty string) - letting Docker use default 'Dockerfile' if present";
          docker build . \
            --build-arg pythonversion=$(cat .python-version) \
            --provenance=false \
            --tag "${{inputs.target}}:${{inputs.tag}}" \
            --target "${{inputs.target}}";
        fi
      working-directory: ${{inputs.folder}}
      shell: bash

    - name: publish versioned container to registry
      uses: wellcomecollection/.github/.github/actions/push_to_ecr@main
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ${{inputs.registry}}
        image_name: ${{inputs.target}}
        local_tag: ${{inputs.tag}}
        registry_tag: ${{inputs.tag}}
        role_to_assume: ${{inputs.role_to_assume}}

    - name: publish latest container to registry
      uses: wellcomecollection/.github/.github/actions/push_to_ecr@main
      if: ${{ inputs.push == 'true' && inputs.publish_latest == 'true' }}
      with:
        registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
        image_name: ${{inputs.target}}
        local_tag: ${{inputs.tag}}
        registry_tag: latest
        role_to_assume: ${{inputs.role_to_assume}}
