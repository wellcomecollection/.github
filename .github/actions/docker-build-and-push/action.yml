name: "Docker build and push"
description: "Builds and publishes a Docker image to ECR"
inputs:
  registry:
    description: "ECR registry where the image is to be published"
    required: true
  folder:
    description: "working folder"
    required: true
  target:
    description: "target to build in a multistage docker"
    required: true
  tag:
    description: "tag for the image"
    required: true
  role_to_assume:
    description: "role to assume when pushing the image to ECR (required unless push is 'false')"
    required: false
    default: ""
  push:
    # String-compared like publish_latest. Lets callers build without
    # publishing on runs that have no repo secrets (dependabot, fork PRs),
    # e.g. push: ${{ secrets.MY_ROLE_ARN != '' }}
    description: "Push the built image to ECR. Any string other than 'true' builds only."
    required: false
    default: "true"
  publish_latest:
    # Compared as a string below: action inputs are always strings, and `type`
    # is ignored here, so a bare truthiness test is true even for "false".
    description: "Publish an image tagged 'latest'. The string 'true' enables it."
    required: false
    default: "false"
  dockerfile:
    description: "Path to the Dockerfile (relative to the working folder)"
    required: false
    default: "Dockerfile"
  build_args:
    # Reaches the script through the environment rather than being interpolated
    # into it, so a caller's value cannot run as shell.
    description: "Extra build arguments, one KEY=VALUE per line. Values are readable in the published image via docker history, so do not pass secrets. pythonversion is passed first and a value here overrides it."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: build docker image
      # Every caller-controlled value reaches the script through the environment
      # rather than being interpolated into it, so none of them can run as shell.
      env:
        BUILD_ARGS: ${{ inputs.build_args }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        TARGET: ${{ inputs.target }}
        TAG: ${{ inputs.tag }}
      run: |
        # One argument list rather than two near-identical commands, so an
        # option cannot be added to the explicit-Dockerfile branch alone.
        # A folder without .python-version builds with an empty value, as it did
        # before this was an array: errexit treats a failed assignment as fatal.
        args=(--build-arg "pythonversion=$(cat .python-version 2>/dev/null || true)" --provenance=false)

        while IFS= read -r build_arg; do
          [ -n "$build_arg" ] && args+=(--build-arg "$build_arg")
        done <<< "$BUILD_ARGS"

        if [ -n "$DOCKERFILE" ]; then
          echo "Using explicit Dockerfile: $DOCKERFILE";
          args+=(-f "$DOCKERFILE")
        else
          echo "No dockerfile input provided (empty string) - letting Docker use default 'Dockerfile' if present";
        fi

        docker build \
          "${args[@]}" \
          --tag "$TARGET:$TAG" \
          --target "$TARGET" \
          .
      working-directory: ${{inputs.folder}}
      shell: bash

    - name: publish versioned container to registry
      uses: wellcomecollection/.github/.github/actions/push_to_ecr@main
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ${{inputs.registry}}
        image_name: ${{inputs.target}}
        local_tag: ${{inputs.tag}}
        registry_tag: ${{inputs.tag}}
        role_to_assume: ${{inputs.role_to_assume}}

    - name: publish latest container to registry
      uses: wellcomecollection/.github/.github/actions/push_to_ecr@main
      if: ${{ inputs.push == 'true' && inputs.publish_latest == 'true' }}
      with:
        registry: 760097843905.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
        image_name: ${{inputs.target}}
        local_tag: ${{inputs.tag}}
        registry_tag: latest
        role_to_assume: ${{inputs.role_to_assume}}
